<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Reference Library</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0a;
    --bg-elevated: #111111;
    --bg-card: #141414;
    --bg-hover: #1a1a1a;
    --border: #222222;
    --border-hover: #10b981;
    --text: #e5e5e5;
    --text-dim: #666666;
    --text-muted: #444444;
    --accent: #10b981;
    --accent-soft: rgba(16, 185, 129, 0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    padding: 48px 32px 0;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
  }
  .badge {
    display: inline-block;
    background: var(--accent);
    color: #000;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff 0%, #888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 20px; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
  }
  .tab {
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); border-color: #333; }
  .tab.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Search */
  .search-wrap { max-width: 500px; margin-bottom: 16px; }
  .search {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: #fff;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: #555; }

  /* Content */
  .content { max-width: 1400px; margin: 0 auto; padding: 24px 32px 48px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Count */
  .count { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 16px; }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  /* Cards */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    border-color: var(--border-hover);
    background: var(--bg-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  .card-name {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-name .preview-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .card-desc {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11px;
    padding: 2px 8px;
    background: #1c1c1c;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    color: #888;
  }

  /* Ref Cards */
  .ref-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ref-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  .ref-thumb {
    width: 100%;
    height: 180px;
    object-fit: cover;
    background: #1a1a1a;
    display: block;
  }
  .ref-info { padding: 16px; }
  .ref-name { font-size: 1rem; font-weight: 600; margin-bottom: 4px; color: #fff; }
  .ref-meta { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px; }
  .ref-analysis { font-size: 0.8rem; color: var(--text-dim); line-height: 1.5; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 90vw;
    max-width: 900px;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .modal-title { font-size: 1.2rem; font-weight: 600; color: #fff; }
  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.15s;
  }
  .modal-close:hover { background: #333; color: #fff; }
  .modal-body {
    overflow: auto;
    padding: 24px;
    flex: 1;
  }
  .modal-body p {
    color: var(--text-dim);
    line-height: 1.7;
    font-size: 0.9rem;
    margin-bottom: 12px;
  }

  /* Preview modal */
  .preview-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .preview-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .preview-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .preview-frame {
    width: 100%;
    height: 60vh;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: #fff;
  }

  /* No results */
  .no-results {
    padding: 64px 32px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  /* Ref detail */

  @media (max-width: 768px) {
    header { padding: 24px 16px 0; }
    .content { padding: 16px; }
    .grid { grid-template-columns: 1fr; }
    h1 { font-size: 1.5rem; }
    .modal { width: 95vw; max-height: 90vh; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="badge">DESIGN.md Collection</div>
    <h1>Design Reference Library</h1>
    <p class="subtitle">71 个设计系统 · DESIGN.md 集合</p>
    <div class="tabs">
      <button class="tab active" data-tab="systems" onclick="switchTab('systems')">设计系统</button>
      <button class="tab" data-tab="images" onclick="switchTab('images')">图片素材</button>
    </div>
    <div class="search-wrap">
      <input class="search" type="text" id="search" placeholder="搜索名称…" oninput="handleSearch(this.value)">
    </div>
  </div>
</header>

<div class="content">
  <div class="tab-content active" id="tab-systems">
    <p class="count" id="count"></p>
    <div class="grid" id="systems-grid"></div>
    <div class="no-results" id="no-results" style="display:none">没有找到匹配的结果</div>
  </div>
  <div class="tab-content" id="tab-images">
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

let currentTab = 'systems';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('search').value = '';
  if (tab === 'systems') renderSystems('');
}

function handleSearch(v) {
  if (currentTab === 'systems') renderSystems(v);
}

function renderSystems(filter) {
  const grid = document.getElementById('systems-grid');
  const noRes = document.getElementById('no-results');
  const filtered = filter
    ? systems.filter(s => s.name.toLowerCase().includes(filter.toLowerCase()) || s.desc.includes(filter) || s.tags.some(t => t.includes(filter)))
    : systems;
  document.getElementById('count').textContent = `共 ${filtered.length} 个设计系统`;
  noRes.style.display = filtered.length ? 'none' : 'block';
  grid.innerHTML = filtered.map(s => `
    <div class="card" onclick="openSystemModal('${s.dir}')">
      <div class="card-name">
        ${s.has_preview ? '<span class="preview-dot"></span>' : ''}
        ${s.name}
      </div>
      <div class="card-desc">${s.desc}</div>
      <div class="card-tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
  `).join('');
}

function openSystemModal(dir) {
  const s = systems.find(x => x.dir === dir);
  if (!s) return;
  document.getElementById('modal-title').textContent = s.name;
  const body = document.getElementById('modal-body');

  if (s.has_preview) {
    body.innerHTML = `
      <div class="preview-toggle">
        <button class="preview-btn active" onclick="switchPreview('${dir}', 'light', this)">Preview</button>
        ${s.has_dark ? `<button class="preview-btn" onclick="switchPreview('${dir}', 'dark', this)">Dark</button>` : ''}
      </div>
      <iframe class="preview-frame" id="preview-frame" src="design-systems/${dir}/preview.html"></iframe>
    `;
  } else {
    let md = s.design_md;
    // Extract text content (strip markdown-ish headers)
    md = md.replace(/^\d+\.\s+/gm, '\n');
    md = md.replace(/\*\*([^*]+)\*\*/g, '$1');
    body.innerHTML = `<div style="max-width:700px"><p>${md}</p></div>`;
  }

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function switchPreview(dir, mode, btn) {
  btn.parentElement.querySelectorAll('.preview-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const frame = document.getElementById('preview-frame');
  if (mode === 'dark') {
    frame.src = 'design-systems/' + dir + '/preview-dark.html';
  } else {
    frame.src = 'design-systems/' + dir + '/preview.html';
  }
}


function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  // Clear iframe src to stop playback
  const frame = document.getElementById('preview-frame');
  if (frame) frame.src = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

renderSystems('');
</script>
