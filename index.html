<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Reference Library</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0a;
    --bg-elevated: #111111;
    --bg-card: #141414;
    --bg-hover: #1a1a1a;
    --border: #222222;
    --border-hover: #10b981;
    --text: #e5e5e5;
    --text-dim: #666666;
    --text-muted: #444444;
    --accent: #10b981;
    --accent-soft: rgba(16, 185, 129, 0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    padding: 48px 32px 0;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
  }
  .badge {
    display: inline-block;
    background: var(--accent);
    color: #000;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff 0%, #888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 20px; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
  }
  .tab {
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text); border-color: #333; }
  .tab.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Search */
  .search-wrap { max-width: 500px; margin-bottom: 16px; }
  .search {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: #fff;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: #555; }

  /* Content */
  .content { max-width: 1400px; margin: 0 auto; padding: 24px 32px 48px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Count */
  .count { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 16px; }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  /* Cards */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    border-color: var(--border-hover);
    background: var(--bg-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  .card-name {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-name .preview-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .card-desc {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11px;
    padding: 2px 8px;
    background: #1c1c1c;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    color: #888;
  }

  /* Ref Cards */
  .ref-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ref-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  .ref-thumb {
    width: 100%;
    height: 180px;
    object-fit: cover;
    background: #1a1a1a;
    display: block;
  }
  .ref-info { padding: 16px; }
  .ref-name { font-size: 1rem; font-weight: 600; margin-bottom: 4px; color: #fff; }
  .ref-meta { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px; }
  .ref-analysis { font-size: 0.8rem; color: var(--text-dim); line-height: 1.5; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 90vw;
    max-width: 900px;
    max-height: 85vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .modal-title { font-size: 1.2rem; font-weight: 600; color: #fff; }
  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.15s;
  }
  .modal-close:hover { background: #333; color: #fff; }
  .modal-body {
    overflow: auto;
    padding: 24px;
    flex: 1;
  }
  .modal-body p {
    color: var(--text-dim);
    line-height: 1.7;
    font-size: 0.9rem;
    margin-bottom: 12px;
  }

  /* Preview modal */
  .preview-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .preview-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .preview-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .preview-frame {
    width: 100%;
    height: 60vh;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: #fff;
  }

  /* No results */
  .no-results {
    padding: 64px 32px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  /* Ref detail */

  @media (max-width: 768px) {
    header { padding: 24px 16px 0; }
    .content { padding: 16px; }
    .grid { grid-template-columns: 1fr; }
    h1 { font-size: 1.5rem; }
    .modal { width: 95vw; max-height: 90vh; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="badge">DESIGN.md Collection</div>
    <h1>Design Reference Library</h1>
    <p class="subtitle">71 个设计系统 · DESIGN.md 集合</p>
    <div class="tabs">
      <button class="tab active" data-tab="systems" onclick="switchTab('systems')">设计系统</button>
      <button class="tab" data-tab="images" onclick="switchTab('images')">图片素材</button>
    </div>
    <div class="search-wrap">
      <input class="search" type="text" id="search" placeholder="搜索名称…" oninput="handleSearch(this.value)">
    </div>
  </div>
</header>

<div class="content">
  <div class="tab-content active" id="tab-systems">
    <p class="count" id="count"></p>
    <div class="grid" id="systems-grid"></div>
    <div class="no-results" id="no-results" style="display:none">没有找到匹配的结果</div>
  </div>
  <div class="tab-content" id="tab-images">
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>


const systems = [{"dir": "airbnb", "name": "airbnb", "desc": "Airbnb's website is a warm, photography-forward marketplace that feels like flipping through a trave…", "tags": ["商业"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Airbnb's website is a warm, photography-forward marketplace that feels like flipping through a travel magazine where every page invites you to book. The design operates on a foundation of pure white (`#ffffff`) with the iconic Rausch Red (`#ff385c`) — named after Airbnb's first street address — serving as the singular brand accent. The result is a clean, airy canvas where listing photography, category icons, and the red CTA button are the only sources of color. The typography uses Airbnb Cereal VF — a custom variable font that's warm and approachable, with rounde"}, {"dir": "airtable", "name": "airtable", "desc": "Airtable's website is a clean, enterprise-friendly platform that communicates \"sophisticated simplic…", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Airtable's website is a clean, enterprise-friendly platform that communicates \"sophisticated simplicity\" through a white canvas with deep navy text (`#181d26`) and Airtable Blue (`#1b61c9`) as the primary interactive accent. The Haas font family (display + text variants) creates a Swiss-precision typography system with positive letter-spacing throughout. **Key Characteristics:** - White canvas with deep navy text (`#181d26`) - Airtable Blue (`#1b61c9`) as primary CTA and link color - Haas + Haas Groot Disp dual font system - Positive letter-spacing on body text ("}, {"dir": "apple", "name": "apple", "desc": "Apple's website is a masterclass in controlled drama — vast expanses of pure black and near-white se…", "tags": ["品牌"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Apple's website is a masterclass in controlled drama — vast expanses of pure black and near-white serve as cinematic backdrops for products that are photographed as if they were sculptures in a gallery. The design philosophy is reductive to its core: every pixel exists in service of the product, and the interface itself retreats until it becomes invisible. This is not minimalism as aesthetic preference; it is minimalism as reverence for the object. The typography anchors everything. San Francisco (SF Pro Display for large sizes, SF Pro Text for body) is Apple's p"}, {"dir": "binance", "name": "Binance", "desc": "A confident financial-platform interface anchored on a deep near-black canvas, where Binance's iconi…", "tags": ["金融"], "has_preview": true, "has_dark": true, "design_md": "Overview Binance reads like a financial trading platform that wants to feel both authoritative and energetic. The base atmosphere is **deep near-black canvas** (`{colors.canvas-dark}` — #0b0e11) holding white type and a single, ubiquitous accent: **Binance Yellow** (`{colors.primary}` — #FCD535). That yellow does almost all of the brand's heavy lifting — it carries every primary CTA, every value-claim headline (\"FUNDS ARE SAFU\"), every \"Sign Up\" pill, every featured tier indicator, and the wordmark itself. There is no secondary brand color. The system trusts the yellow voltage to do the brand"}, {"dir": "bmw", "name": "bmw", "desc": "BMW's website is automotive engineering made visual — a design system that communicates precision, p…", "tags": ["品牌"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere BMW's website is automotive engineering made visual — a design system that communicates precision, performance, and German industrial confidence. The page alternates between deep dark hero sections (featuring full-bleed automotive photography) and clean white content areas, creating a cinematic rhythm reminiscent of a luxury car showroom where vehicles are lit against darkness. The BMW CI2020 design language (their corporate identity refresh) defines every element. The typography is built on BMWTypeNextLatin — a proprietary typeface in two variants: BMWTypeNextLa"}, {"dir": "bmw-m", "name": "BMW M", "desc": "A motorsport-engineering interface anchored on a near-black canvas with white BMW Type Next Latin di…", "tags": ["品牌"], "has_preview": true, "has_dark": true, "design_md": "Overview BMW M's marketing surface is a near-pure black canvas (`{colors.canvas}` — #000) holding white BMW Type Next Latin headlines in **confident UPPERCASE**. The system has no decorative voltage of its own; brand energy comes from **full-bleed automotive photography** — cars cornering at speed, carbon-fiber wheel detail, driver cockpit shots, motorsport pit lanes — placed as edge-to-edge content that fills entire bands. UI chrome around the photography stays minimal: thin sans-serif copy, dividers as 1px hairlines (`{colors.hairline}`), all-caps button labels with no fill until hovered."}, {"dir": "bugatti", "name": "Bugatti", "desc": "An austere luxury-automotive interface that uses near-pure black canvas, white uppercase letterspace…", "tags": ["品牌"], "has_preview": true, "has_dark": true, "design_md": "Overview Bugatti's marketing surface is the most austere interface in luxury automotive: a near-pure black canvas (`{colors.canvas}` — #000000) holding white uppercase **letterspaced** display type and full-bleed automotive photography. The system has no accent color, no surface card decoration, no shadows, no gradients, no chrome — only **photography, typography, and the brand wordmark**. Every other luxury auto site in this category (BMW M, Aston Martin, Lamborghini) uses some form of accent color or signature element; Bugatti uses nothing. The empty space, the photograph, and the precisely"}, {"dir": "cal", "name": "cal", "desc": "Cal.com's website is a masterclass in monochromatic restraint — a grayscale world where boldness com…", "tags": ["综合"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Cal.com's website is a masterclass in monochromatic restraint — a grayscale world where boldness comes not from color but from the sheer confidence of black text on white space. Inspired by Uber's minimal aesthetic, the palette is deliberately stripped of hue: near-black headings (`#242424`), mid-gray secondary text (`#898989`), and pure white surfaces. Color is treated as a foreign substance — when it appears (a rare blue link, a green trust badge), it feels like a controlled accent in an otherwise black-and-white photograph. Cal Sans, the brand's custom geometr"}, {"dir": "claude", "name": "claude", "desc": "Claude's interface is a literary salon reimagined as a product page — warm, unhurried, and quietly i…", "tags": ["AI"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Claude's interface is a literary salon reimagined as a product page — warm, unhurried, and quietly intellectual. The entire experience is built on a parchment-toned canvas (`#f5f4ed`) that deliberately evokes the feeling of high-quality paper rather than a digital surface. Where most AI product pages lean into cold, futuristic aesthetics, Claude's design radiates human warmth, as if the AI itself has good taste in interior design. The signature move is the custom Anthropic Serif typeface — a medium-weight serif with generous proportions that gives every headline"}, {"dir": "clay", "name": "clay", "desc": "Clay's website is a warm, playful celebration of color that treats B2B data enrichment like a craft …", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Clay's website is a warm, playful celebration of color that treats B2B data enrichment like a craft rather than an enterprise chore. The design language is built on a foundation of warm cream backgrounds (`#faf9f7`) and oat-toned borders (`#dad4c8`, `#eee9df`) that give every surface the tactile quality of handmade paper. Against this artisanal canvas, a vivid swatch palette explodes with personality — Matcha green, Slushie cyan, Lemon gold, Ube purple, Pomegranate pink, Blueberry navy, and Dragonfruit magenta — each named like flavors at a juice bar, not colors i"}, {"dir": "clickhouse", "name": "clickhouse", "desc": "ClickHouse's interface is a high-performance cockpit rendered in acid yellow-green on obsidian black…", "tags": ["技术"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere ClickHouse's interface is a high-performance cockpit rendered in acid yellow-green on obsidian black — a design that screams \"speed\" before you read a single word. The entire experience lives in darkness: pure black backgrounds (`#000000`) with dark charcoal cards (`#414141` borders) creating a terminal-grade aesthetic where the only chromatic interruption is the signature neon yellow-green (`#faff69`) that slashes across CTAs, borders, and highlighted moments like a highlighter pen on a dark console. The typography is aggressively heavy — Inter at weight 900 (Bl"}, {"dir": "cohere", "name": "cohere", "desc": "Cohere's interface is a polished enterprise command deck — confident, clean, and designed to make AI…", "tags": ["AI"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Cohere's interface is a polished enterprise command deck — confident, clean, and designed to make AI feel like serious infrastructure rather than a consumer toy. The experience lives on a bright white canvas where content is organized into generously rounded cards (22px radius) that create an organic, cloud-like containment language. This is a site that speaks to CTOs and enterprise architects: professional without being cold, sophisticated without being intimidating. The design language bridges two worlds with a dual-typeface system: CohereText, a custom display"}, {"dir": "coinbase", "name": "coinbase", "desc": "Coinbase's website is a clean, trustworthy crypto platform that communicates financial reliability t…", "tags": ["金融"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Coinbase's website is a clean, trustworthy crypto platform that communicates financial reliability through a blue-and-white binary palette. The design uses Coinbase Blue (`#0052ff`) — a deep, saturated blue — as the singular brand accent against white and near-black surfaces. The proprietary font family includes CoinbaseDisplay for hero headlines, CoinbaseSans for UI text, CoinbaseText for body reading, and CoinbaseIcons for iconography — a comprehensive four-font system. The button system uses a distinctive 56px radius for pill-shaped CTAs with hover transitions"}, {"dir": "composio", "name": "composio", "desc": "Composio's interface is a nocturnal command center — a dense, developer-focused darkness punctuated …", "tags": ["AI"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Composio's interface is a nocturnal command center — a dense, developer-focused darkness punctuated by electric cyan and deep cobalt signals. The entire experience is built on an almost-pure-black canvas (`#0f0f0f`) where content floats within barely-visible containment borders, creating the feeling of a high-tech control panel rather than a traditional marketing page. It's a site that whispers authority to developers who live in dark terminals. The visual language leans heavily into the aesthetic of code editors and terminal windows. JetBrains Mono appears along"}, {"dir": "cursor", "name": "cursor", "desc": "Cursor's website is a study in warm minimalism meets code-editor elegance. The entire experience is …", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Cursor's website is a study in warm minimalism meets code-editor elegance. The entire experience is built on a warm off-white canvas (`#f2f1ed`) with dark warm-brown text (`#26251e`) -- not pure black, not neutral gray, but a deeply warm near-black with a yellowish undertone that evokes old paper, ink, and craft. This warmth permeates every surface: backgrounds lean toward cream (`#e6e5e0`, `#ebeae5`), borders dissolve into transparent warm overlays using `oklab` color space, and even the error state (`#cf2d56`) carries warmth rather than clinical red. The result"}, {"dir": "elevenlabs", "name": "elevenlabs", "desc": "ElevenLabs' website is a study in restrained elegance — a near-white canvas (#ffffff, #f5f5f5) where…", "tags": ["AI"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere ElevenLabs' website is a study in restrained elegance — a near-white canvas (`#ffffff`, `#f5f5f5`) where typography and subtle shadows do all the heavy lifting. The design feels like a premium audio product brochure: clean, spacious, and confident enough to let the content speak (literally, given ElevenLabs makes voice AI). There's an almost Apple-like quality to the whitespace strategy, but warmer — the occasional warm stone tint (`#f5f2ef`, `#777169`) prevents the purity from feeling clinical. The typography system is built on a fascinating duality: Waldenburg"}, {"dir": "expo", "name": "expo", "desc": "Expo's interface is a luminous, confidence-radiating developer platform built on the premise that to…", "tags": ["技术"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Expo's interface is a luminous, confidence-radiating developer platform built on the premise that tools for building apps should feel as polished as the apps themselves. The entire experience lives on a bright, airy canvas — a cool-tinted off-white (`#f0f0f3`) that gives the page a subtle technological coolness without the starkness of pure white. This is a site that breathes: enormous vertical spacing between sections creates a gallery-like pace where each feature gets its own \"room.\" The design language is decisively monochromatic — pure black (`#000000`) headl"}, {"dir": "ferrari", "name": "Ferrari", "desc": "A luxury-automotive brand whose marketing surfaces read as cinematic editorial. The base canvas is n…", "tags": ["品牌"], "has_preview": true, "has_dark": true, "design_md": "Overview Ferrari's marketing site reads as cinematic editorial — closer to a luxury-magazine spread than a typical car-OEM site. The base canvas is **near-black** (`{colors.canvas}` — #181818) holding pure white display type; white-canvas bands appear only inside specific editorial contexts (preowned listings, pricing tables, dealer surfaces). The single brand voltage is **Rosso Corsa** (`{colors.primary}` — #da291c), the iconic Ferrari racing red, used scarcely on primary CTAs, the Cavallino mark, and Formula 1 race-position highlights. Type runs **FerrariSans** as the single sans family at"}, {"dir": "figma", "name": "figma", "desc": "Figma's interface is the design tool that designed itself — a masterclass in typographic sophisticat…", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Figma's interface is the design tool that designed itself — a masterclass in typographic sophistication where a custom variable font (figmaSans) modulates between razor-thin (weight 320) and bold (weight 700) with stops at unusual intermediates (330, 340, 450, 480, 540) that most type systems never explore. This granular weight control gives every text element a precisely calibrated visual weight, creating hierarchy through micro-differences rather than the blunt instrument of \"regular vs bold.\" The page presents a fascinating duality: the interface chrome is str"}, {"dir": "framer", "name": "framer", "desc": "Framer's website is a cinematic, tool-obsessed dark canvas that radiates the confidence of a design …", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Framer's website is a cinematic, tool-obsessed dark canvas that radiates the confidence of a design tool built by designers who worship craft. The entire experience is drenched in pure black — not a warm charcoal or a cozy dark gray, but an absolute void (`#000000`) that makes every element, every screenshot, every typographic flourish feel like it's floating in deep space. This is a website that treats its own product UI as the hero art, embedding full-fidelity screenshots and interactive demos directly into the narrative flow. The typography is the signature mo"}, {"dir": "hashicorp", "name": "hashicorp", "desc": "HashiCorp's website is enterprise infrastructure made tangible — a design system that must communica…", "tags": ["技术"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere HashiCorp's website is enterprise infrastructure made tangible — a design system that must communicate the complexity of cloud infrastructure management while remaining approachable. The visual language splits between two modes: a clean white light-mode for informational sections and a dramatic dark-mode (`#15181e`, `#0d0e12`) for hero areas and product showcases, creating a day/night duality that mirrors the \"build in light, deploy in dark\" developer workflow. The typography is anchored by a custom brand font (HashiCorp Sans, loaded as `__hashicorpSans_96f0ca`)"}, {"dir": "ibm", "name": "ibm", "desc": "IBM's website is the digital embodiment of enterprise authority built on the Carbon Design System — …", "tags": ["技术"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere IBM's website is the digital embodiment of enterprise authority built on the Carbon Design System — a design language so methodically structured it reads like an engineering specification rendered as a webpage. The page operates on a stark duality: a bright white (`#ffffff`) canvas with near-black (`#161616`) text, punctuated by a single, unwavering accent — IBM Blue 60 (`#0f62fe`). This isn't playful tech-startup minimalism; it's corporate precision distilled into pixels. Every element exists within Carbon's rigid 2x grid, every color maps to a semantic token, ev"}, {"dir": "intercom", "name": "intercom", "desc": "Intercom's website is a warm, confident customer service platform that communicates \"AI-first helpde…", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Intercom's website is a warm, confident customer service platform that communicates \"AI-first helpdesk\" through a clean, editorial design language. The page operates on a warm off-white canvas (`#faf9f6`) with off-black (`#111111`) text, creating an intimate, magazine-like reading experience. The signature Fin Orange (`#ff5600`) — named after Intercom's AI agent — serves as the singular vibrant accent against the warm neutral palette. The typography uses Saans — a custom geometric sans-serif with aggressive negative letter-spacing (-2.4px at 80px, -0.48px at 24px"}, {"dir": "kraken", "name": "kraken", "desc": "Kraken's website is a clean, trustworthy crypto exchange that uses purple as its commanding brand co…", "tags": ["金融"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Kraken's website is a clean, trustworthy crypto exchange that uses purple as its commanding brand color. The design operates on white backgrounds with Kraken Purple (`#7132f5`, `#5741d8`, `#5b1ecf`) creating a distinctive, professional crypto identity. The proprietary Kraken-Brand font handles display headings with bold (700) weight and negative tracking, while Kraken-Product (with IBM Plex Sans fallback) serves as the UI workhorse. **Key Characteristics:** - Kraken Purple (`#7132f5`) as primary brand with darker variants (`#5741d8`, `#5b1ecf`) - Kraken-Brand (di"}, {"dir": "lamborghini", "name": "lamborghini", "desc": "Lamborghini's website is a cathedral of darkness — a digital stage where jet-black surfaces stretch …", "tags": ["品牌"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Lamborghini's website is a cathedral of darkness — a digital stage where jet-black surfaces stretch infinitely and every element emerges from the void like a machine under a spotlight. The page is almost entirely black. Not dark gray, not near-black — true, uncompromising black (`#000000`) that saturates the viewport and refuses to yield. Into this abyss, white type and Lamborghini Gold (`#FFC000`) are deployed with surgical precision, creating a visual language that feels like walking through a nighttime motorsport event where every surface absorbs light except t"}, {"dir": "linear.app", "name": "linear.app", "desc": "Linear's website is a masterclass in dark-mode-first product design — a near-black canvas (#08090a) …", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Linear's website is a masterclass in dark-mode-first product design — a near-black canvas (`#08090a`) where content emerges from darkness like starlight. The overall impression is one of extreme precision engineering: every element exists in a carefully calibrated hierarchy of luminance, from barely-visible borders (`rgba(255,255,255,0.05)`) to soft, luminous text (`#f7f8f8`). This is not a dark theme applied to a light design — it is darkness as the native medium, where information density is managed through subtle gradations of white opacity rather than color va"}, {"dir": "lovable", "name": "lovable", "desc": "Lovable's website radiates warmth through restraint. The entire page sits on a creamy, parchment-ton…", "tags": ["技术"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Lovable's website radiates warmth through restraint. The entire page sits on a creamy, parchment-toned background (`#f7f4ed`) that immediately separates it from the cold-white conventions of most developer tool sites. This isn't minimalism for minimalism's sake — it's a deliberate choice to feel approachable, almost analog, like a well-crafted notebook. The near …", "tags": ["AI"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere MiniMax's website is a clean, product-showcase platform for a Chinese AI technology company that bridges consumer-friendly appeal with technical credibility. The design language is predominantly white-space-driven with a light, airy feel — pure white backgrounds (`#ffffff`) dominate, letting colorful product cards and AI model illustrations serve as the visual anchors. The overall aesthetic sits at the intersection of Apple's product marketing clarity and a playful, rounded design language that makes AI technology feel approachable. The typography system is notab"}, {"dir": "mintlify", "name": "mintlify", "desc": "Mintlify's website is a study in documentation-as-product design — a white, airy, information-rich s…", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Mintlify's website is a study in documentation-as-product design — a white, airy, information-rich surface that treats clarity as its highest aesthetic value. The page opens with a luminous white (`#ffffff`) background, near-black (`#0d0d0d`) text, and a signature green brand accent (`#18E299`) that signals freshness and intelligence without dominating the palette. The overall mood is calm, confident, and engineered for legibility — a design system that whispers \"we care about your developer experience\" in every pixel. The Inter font family carries the entire typ"}, {"dir": "miro", "name": "miro", "desc": "Miro's website is a clean, collaborative-tool-forward platform that communicates \"visual thinking\" t…", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Miro's website is a clean, collaborative-tool-forward platform that communicates \"visual thinking\" through generous whitespace, pastel accent colors, and a confident geometric font. The design uses a predominantly white canvas with near-black text (`#1c1c1e`) and a distinctive pastel color palette — coral, rose, teal, orange, yellow, moss — each representing different collaboration contexts. The typography uses Roobert PRO Medium as the primary display font with OpenType character variants (`\"blwf\", \"cv03\", \"cv04\", \"cv09\", \"cv11\"`) and negative letter-spacing (-1"}, {"dir": "mistral.ai", "name": "mistral.ai", "desc": "Mistral AI's interface is a sun-drenched landscape rendered in code — a warm, bold, unapologetically…", "tags": ["AI"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Mistral AI's interface is a sun-drenched landscape rendered in code — a warm, bold, unapologetically European design that trades the typical blue-screen AI aesthetic for golden amber, burnt orange, and the feeling of late-afternoon light in southern France. Every surface glows with warmth: backgrounds fade from pale cream to deep amber, shadows carry golden undertones (`rgba(127, 99, 21, ...)`), and the brand's signature orange (`#fa520f`) burns through the page like a signal fire. The design language is maximalist in its warmth but minimalist in its structure. H"}, {"dir": "mongodb", "name": "mongodb", "desc": "MongoDB's website is a deep-forest-meets-terminal experience — a design system rooted in the darkest…", "tags": ["技术"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere MongoDB's website is a deep-forest-meets-terminal experience — a design system rooted in the darkest teal-black (`#001e2b`) that evokes both the density of a database and the depth of a forest canopy. Against this near-black canvas, a striking neon green (`#00ed64`) pulses as the brand accent — bright enough to feel electric, organic enough to feel alive. This isn't the cold neon of cyberpunk; it's the bioluminescent green of something growing in the dark. The typography system is architecturally ambitious: MongoDB Value Serif for massive hero headlines (96px) cr"}, {"dir": "nike", "na DIA's signature green (`#76b900`) -- a color so specific it functions as a brand fingerprint. This is not the lush green of nature; it's the electric, lime-shifted green of GPU-rendered light, a color that sits between chartreuse and kelly green and immediately signals \"NVIDIA\" to anyone in technology. The custom NVIDIA-EMEA font fami"}, {"dir": "ollama", "name": "ollama", "desc": "Ollama's interface is radical minimalism taken to its logical conclusion — a pure-white void where c…", "tags": ["AI"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Ollama's interface is radical minimalism taken to its logical conclusion — a pure-white void where content floats without decoration, shadow, or color. The design philosophy mirrors the product itself: strip away everything unnecessary until only the essential tool remains. This is the digital equivalent of a Dieter Rams object — every pixel earns its place, and the absence of design IS the design. The entire page exists in pure grayscale. There is zero chromatic color in the interface — no brand blue, no accent green, no semantic red. The only colors that exist"}, {"dir": "opencode.ai", "name": "opencode.ai", "desc": "OpenCode's website embodies a terminal-native, monospace-first aesthetic that reflects its identity …", "tags": ["AI"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere OpenCode's website embodies a terminal-native, monospace-first aesthetic that reflects its identity as an open source AI coding agent. The entire visual system is built on a stark dark-on-light contrast using a near-black background (`#201d1d`) with warm off-white text (`#fdfcfc`). This isn't a generic dark theme -- it's a warm, slightly reddish-brown dark that feels like a sophisticated terminal emulator rather than a cold IDE. The warm undertone in both the darks and lights (notice the subtle red channel in `#201d1d` -- rgb(32, 29, 29)) creates a cohesive, lived"}, {"dir": "pinterest", "name": "pinterest", "desc": "Pinterest's website is a warm, inspiration-driven canvas that treats visual discovery like a lifesty…", "tags": ["媒体"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Pinterest's website is a warm, inspiration-driven canvas that treats visual discovery like a lifestyle magazine. The design operates on a soft, slightly warm white background with Pinterest Red (`#e60023`) as the singular, bold brand accent. Unlike the cool blues of most tech platforms, Pinterest's neutral scale has a distinctly warm undertone — grays lean toward olive/sand (`#91918c`, `#62625b`, `#e5e5e0`) rather than cool steel, creating a cozy, craft-like atmosphere that invites browsing. The typography uses Pin Sans — a custom proprietary font with a broad fa"}, {"dir": "playstation", "name": "PlayStation", "desc": "|", "tags": ["娱乐"], "has_preview": true, "has_dark": true, "design_md": "Overview PlayStation's marketing system reads like a console launch trailer scrolling past the viewer in chapters. Each section is a full-bleed band — pure black `{colors.canvas-dark}`, true white `{colors.canvas-light}`, or PlayStation Blue `{colors.primary}` — and each chapter owns one editorial moment: hero console photography, a games-coming-soon strip, the PlayStation Plus tier banner, the \"30 Years of PlayStation\" anniversary band, the news strip from the PlayStation Blog. There is no decorative chrome between chapters; the section background change IS the divider. Sections stack at `{s"}, {"dir": "posthog", "name": "posthog", "desc": "PostHog's website feels like a startup's internal wiki that escaped into the wild — warm, irreverent…", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere PostHog's website feels like a startup's internal wiki that escaped into the wild — warm, irreverent, and deliberately anti-corporate. The background isn't the expected crisp white or dark void of developer tools; it's a warm, sage-tinted cream (`#fdfdf8`) that gives every surface a handmade, paper-like quality. Colors lean into earthy olive greens and muted sage rather than the conventional blues and purples of the SaaS world. It's as if someone designed a developer analytics platform inside a cozy garden shed. The personality is the star: hand-drawn hedgehog il"}, {"dir": "raycast", "name": "raycast", "desc": "Raycast's marketing site feels like the dark interior of a precision instrument — a Swiss watch case…", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Raycast's marketing site feels like the dark interior of a precision instrument — a Swiss watch case carved from obsidian. The background isn't just dark, it's an almost-black blue-tint (`#07080a`) that creates a sense of being inside a macOS native application rather than a website. Every surface, every border, every shadow is calibrated to evoke the feeling of a high-performance desktop utility: fast, minimal, trustworthy. The signature move is the layered shadow system borrowed from macOS window chrome: multi-layer box-shadows with inset highlights that simula"}, {"dir": "renault", "name": "Renault", "desc": "|", "tags": ["品牌"], "has_preview": true, "has_dark": true, "design_md": "Overview Renault's Turkish marketing surfaces are unapologetically high-contrast: a white canvas for browsing, a black canvas for product storytelling, and a single Sunlight Yellow accent (`{colors.primary}` — `#ffed00`) reserved for the most consequential actions. The brand's modernised flat diamond logo sets the tone — geometric, confident, slightly industrial — and the system follows suit. Square corners dominate, hairline borders are rare, and elevation is expressed through colour blocking rather than shadow. The typography is monolithic. Every text on the site is set in **NouvelR**, Ren"}, {"dir": "replicate", "name": "replicate", "desc": "Replicate's interface is a developer playground crackling with creative energy — a bold, high-contra…", "tags": ["AI"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Replicate's interface is a developer playground crackling with creative energy — a bold, high-contrast design that feels more like a music festival poster than a typical API platform. The hero section explodes with a vibrant orange-red-magenta gradient that immediately signals \"this is where AI models come alive,\" while the body of the page grounds itself in a clean white canvas where code snippets and model galleries take center stage. The design personality is defined by two extreme choices: **massive display typography** (up to 128px) using the custom rb-freig"}, {"dir": "resend", "name": "resend", "desc": "Resend's website is a dark, cinematic canvas that treats email infrastructure like a luxury product.…", "tags": ["技术"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Resend's website is a dark, cinematic canvas that treats email infrastructure like a luxury product. The entire page is draped in pure black (`#000000`) with text that glows in near-white (`#f0f0f0`), creating a theater-like experience where content performs on a void stage. This isn't the typical developer-tool darkness — it's the controlled darkness of a photography gallery, where every element is lit with intention and nothing competes for attention. The typography system is the star of the show. Three carefully chosen typefaces create a hierarchy that feels b"}, {"dir": "revolut", "name": "revolut", "desc": "Revolut's website is fintech confidence distilled into pixels — a design system that communicates \"y…", "tags": ["金融"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Revolut's website is fintech confidence distilled into pixels — a design system that communicates \"your money is in capable hands\" through massive typography, generous whitespace, and a disciplined neutral palette. The visual language is built on Aeonik Pro, a geometric grotesque that creates billboard-scale headlines at 136px with weight 500 and aggressive negative tracking (-2.72px). This isn't subtle branding; it's fintech at stadium scale. The color system is built on a comprehensive `--rui-*` (Revolut UI) token architecture with semantic naming for every sta"}, {"dir": "runwayml", "name": "runwayml", "desc": "Runway's interface is a cinematic reel brought to life as a website — a dark, editorial, film-produc…", "tags": ["媒体"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Runway's interface is a cinematic reel brought to life as a website — a dark, editorial, film-production-grade design where full-bleed photography and video ARE the primary UI elements. This is not a typical tech product page; it's a visual manifesto for AI-powered creativity. Every section feels like a frame from a film: dramatic lighting, sweeping landscapes, and intimate human moments captured in high-quality imagery that dominates the viewport. The design language is built on a single typeface — abcNormal — a clean, geometric sans-serif that handles everythin"}, {"dir": "sanity", "name": "sanity", "desc": "Sanity's website is a developer-content platform rendered as a nocturnal command center -- dark, pre…", "tags": ["技术"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Sanity's website is a developer-content platform rendered as a nocturnal command center -- dark, precise, and deeply structured. The entire experience sits on a near-black canvas (`#0b0b0b`) that reads less like a \"dark mode toggle\" and more like the natural state of a tool built for people who live in terminals. Where most CMS marketing pages reach for friendly pastels and soft illustration, Sanity leans into the gravity of its own product: structured content deserves a structured stage. The signature typographic voice is waldenburgNormal -- a distinctive, sligh"}, {"dir": "sentry", "name": "sentry", "desc": "Sentry's website is a dark-mode-first developer tool interface that speaks the language of code edit…", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Sentry's website is a dark-mode-first developer tool interface that speaks the language of code editors and terminal windows. The entire aesthetic is rooted in deep purple-black backgrounds (`#1f1633`, `#150f23`) that evoke the late-night debugging sessions Sentry was built for. Against this inky canvas, a carefully curated set of purples, pinks, and a distinctive lime-green accent (`#c2ef4e`) create a visual system that feels simultaneously technical and vibrant. The typography pairing is deliberate: \"Dammit Sans\" appears at hero scale (88px, weight 700) as a di"}, {"dir": "shopify", "name": "Shopifi Inspired", "desc": "An inspired interpretation of Shopifi's design language — a cinematic commerce platform that runs tw…", "tags": ["综合"], "has_preview": true, "has_dark": true, "design_md": "Overview Shopifi runs two parallel design tracks that share typographic DNA and a single button vocabulary, but diverge in canvas polarity. The marketing track lives on `{colors.canvas-night}` (`#000000`) — full-bleed cinematic photography of merchants, giant `{typography.display-xxl}` headlines in Neue Haas Grotesk Display set at weight 330 (a thin, almost editorial cut), and a single CTA: a white-stroked black pill with the form `button-outline-on-dark`. The pages read like the spread of a high-end print magazine: lots of black, lots of negative space, photography that doesn't compete with"}, {"dir": "slack", "name": "Slacc Inspired", "desc": "An inspired interpretation of Slacc's design language — a workplace messaging brand built on a deep …", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "Overview Slacc's design language centers on a deep aubergine primary (`{colors.primary}`) — the brand's most enduring visual asset — applied as the dominant button color, the footer band, the featured pricing tier, and the brand wordmark. Around that aubergine the system stages an unusually delicate ecosystem: cream-lavender hero canvases with soft pastel-mesh gradients (peachy oranges, lavenders, dusty greens) that pulse behind floating product UI mockups, with the actual interface chrome rendered in fine detail at 3:2 aspect. Typography splits between two proprietary humanist sans families"}, {"dir": "spacex", "name": "spacex", "desc": "SpaceX's website is a full-screen cinematic experience that treats aerospace engineering like a film…", "tags": ["娱乐"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere SpaceX's website is a full-screen cinematic experience that treats aerospace engineering like a film — every section is a scene, every photograph is a frame, and the interface disappears entirely behind the imagery. The design is pure black (`#000000`) with photography of rockets, space, and planets occupying 100% of the viewport. Text overlays sit directly on these photographs with no background panels, cards, or containers — just type on image, bold and unapologetic. The typography system uses D-DIN, an industrial geometric typeface with DIN heritage (the Germa"}, {"dir": "spotify", "name": "spotify", "desc": "Spotify's web interface is a dark, immersive music player that wraps listeners in a near-black cocoo…", "tags": ["媒体"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Spotify's web interface is a dark, immersive music player that wraps listeners in a near-black cocoon (`#121212`, `#181818`, `#1f1f1f`) where album art and content become the primary source of color. The design philosophy is \"content-first darkness\" — the UI recedes into shadow so that music, podcasts, and playlists can glow. Every surface is a shade of charcoal, creating a theater-like environment where the only true color comes from the iconic Spotify Green (`#1ed760`) and the album artwork itself. The typography uses SpotifyMixUI and SpotifyMixUITitle — propri"}, {"dir": "starbucks", "name": "starbucks", "desc": "Starbucks' design system is a warm, confident retail flagship wearing the green of their storefront …", "tags": ["商业"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Starbucks' design system is a **warm, confident retail flagship** wearing the green of their storefront apron across every surface. The canvas alternates between a neutral-warm cream (`#f2f0eb`) and a ceramic off-white (`#edebe9`) — colors that reference actual store materials: the paper napkins, the café walls, the wood finishes — while the signature **Starbucks Green** (`#006241`) anchors the brand moment on hero bands, CTAs, and the Rewards experience. The greens come in four calibrated shades (Starbucks, Accent, House, Uplift) each mapped to a specific surface"}, {"dir": "stripe", "name": "stripe", "desc": "Stripe's website is the gold standard of fintech design -- a system that manages to feel simultaneou…", "tags": ["金融"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Stripe's website is the gold standard of fintech design -- a system that manages to feel simultaneously technical and luxurious, precise and warm. The page opens on a clean white canvas (`#ffffff`) with deep navy headings (`#061b31`) and a signature purple (`#533afd`) that functions as both brand anchor and interactive accent. This isn't the cold, clinical purple of enterprise software; it's a rich, saturated violet that reads as confident and premium. The overall impression is of a financial institution redesigned by a world-class type foundry. The custom `sohne"}, {"dir": "supabase", "name": "supabase", "desc": "Supabase's website is a dark-mode-native developer platform that channels the aesthetic of a premium…", "tags": ["技术"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Supabase's website is a dark-mode-native developer platform that channels the aesthetic of a premium code editor — deep black backgrounds (`#0f0f0f`, `#171717`) with emerald green accents (`#3ecf8e`, `#00c573`) that reference the brand's open-source, PostgreSQL-green identity. The design system feels like it was born in a terminal window and evolved into a sophisticated marketing surface without losing its developer soul. The typography is built on \"Circular\" — a geometric sans-serif with rounded terminals that softens the technical edge. At 72px with a 1.00 line"}, {"dir": "superhuman", "name": "superhuman", "desc": "Superhuman's website feels like opening a luxury envelope — predominantly white, immaculately clean,…", "tags": ["综合"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Superhuman's website feels like opening a luxury envelope — predominantly white, immaculately clean, with a single dramatic gesture of color that commands attention. The hero section is a cinematic purple gradient, a deep twilight wash of `#1b1938` that evokes the moment just before dawn, overlaid with confident white typography. Below this dramatic entrance, the rest of the site is almost entirely white canvas with dark charcoal text, creating a stark but refined reading experience. The typography is the true signature: Super Sans VF, a custom variable font with"}, {"dir": "tesla", "name": "tesla", "desc": "Tesla's website is an exercise in radical subtraction — a digital showroom where the product is ever…", "tags": ["品牌"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Tesla's website is an exercise in radical subtraction — a digital showroom where the product is everything and the interface is almost nothing. The page opens with a full-viewport hero that fills the entire screen with cinematic car photography: three vehicles arranged on polished concrete against a hazy cityscape sky, with a single model name floating above in translucent white type. There are no decorative borders, no gradients, no patterns, no shadows. The UI exists only to provide just enough navigational structure to get out of the way. Every pixel that isn't"}, {"dir": "theverge", "name": "theverge", "desc": "The Verge's 2024 redesign feels like somebody wired a Condé Nast magazine to a chiptune soundboard. …", "tags": ["媒体"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere The Verge's 2024 redesign feels like somebody wired a Condé Nast magazine to a chiptune soundboard. The canvas is almost-black (`#131313`), the headlines are built from a brutally heavy display face (Manuka) that runs up to 107px, and the whole page is peppered with acid-mint `#3cffd0` and ultraviolet `#5200ff` that behave less like brand colors and more like hazard tape. Story tiles are not quiet gray cards — they're saturated, full-bleed color blocks (yellow, pink, orange, blue, purple) that feel like pasted-up rave flyers arranged into a timeline. The mood is \""}, {"dir": "together.ai", "name": "together.ai", "desc": "Together AI's interface is a pastel-gradient dreamscape built for enterprise AI infrastructure — a d…", "tags": ["AI"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Together AI's interface is a pastel-gradient dreamscape built for enterprise AI infrastructure — a design that somehow makes GPU clusters and model inference feel light, airy, and optimistic. The hero section blooms with soft pink-blue-lavender gradients and abstract, painterly illustrations that evoke clouds and flight, establishing a visual metaphor for the \"AI-Native Cloud\" proposition. Against this softness, the typography cuts through with precision: \"The Future\" display font at 64px with aggressive negative tracking (-1.92px) creates dense, authoritative hea"}, {"dir": "uber", "name": "uber", "desc": "Uber's design language is a masterclass in confident minimalism -- a black-and-white universe where …", "tags": ["商业"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Uber's design language is a masterclass in confident minimalism -- a black-and-white universe where every pixel serves a purpose and nothing decorates without earning its place. The entire experience is built on a stark duality: jet black (`#000000`) and pure white (`#ffffff`), with virtually no mid-tone grays diluting the message. This isn't the sterile minimalism of a startup that hasn't finished designing -- it's the deliberate restraint of a brand so established it can afford to whisper. The signature typeface, UberMove, is a proprietary geometric sans-serif"}, {"dir": "vercel", "name": "vercel", "desc": "Vercel's website is the visual thesis of developer infrastructure made invisible — a design system s…", "tags": ["技术"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Vercel's website is the visual thesis of developer infrastructure made invisible — a design system so restrained it borders on philosophical. The page is overwhelmingly white (`#ffffff`) with near-black (`#171717`) text, creating a gallery-like emptiness where every element earns its pixel. This isn't minimalism as decoration; it's minimalism as engineering principle. The Geist design system treats the interface like a compiler treats code — every unnecessary token is stripped away until only structure remains. The custom Geist font family is the crown jewel. Gei"}, {"dir": "vodafone", "name": "Vodafone Inspired", "desc": "An inspired interpretation of Vodafone's design language — a telecom super-brand whose web surface a…", "tags": ["品牌"], "has_preview": true, "has_dark": true, "design_md": "Overview Vodafone is a global telecom super-brand and its web surface delivers exactly that posture: heroic editorial photography, occasionally cropping a portrait so tight only an eye line and a phone hand are visible, with a single colossal uppercase headline floating on top in the brand's proprietary heavy display weight. The page reads like a campaign poster more than a corporate site, then breaks into a calmer content rhythm of light-canvas story cards and a single red marker (the iconic speechmark logo) drawing the eye to the brand's centre of gravity. There is no second accent colour c"}, {"dir": "voltagent", "name": "voltagent", "desc": "VoltAgent's interface is a deep-space command terminal for the AI age — a developer-facing darkness …", "tags": ["综合"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere VoltAgent's interface is a deep-space command terminal for the AI age — a developer-facing darkness built on near-pure-black surfaces (`#050507`) where the only interruption is the electric pulse of emerald green energy. The entire experience evokes the feeling of staring into a high-powered IDE at 2am: dark, focused, and alive with purpose. This is not a friendly SaaS landing page — it's an engineering platform that announces itself through code snippets, architectural diagrams, and raw technical confidence. The green accent (`#00d992`) is used with surgical pre"}, {"dir": "warp", "name": "warp", "desc": "Warp's website feels like sitting at a campfire in a deep forest — warm, dark, and alive with quiet …", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Warp's website feels like sitting at a campfire in a deep forest — warm, dark, and alive with quiet confidence. Unlike the cold, blue-tinted blacks favored by most developer tools, Warp wraps everything in a warm near-black that feels like charred wood or dark earth. The text isn't pure white either — it's Warm Parchment (`#faf9f6`), a barely-perceptible cream that softens every headline and makes the dark canvas feel inviting rather than austere. The typography is the secret weapon: Matter, a geometric sans-serif with distinctive character, deployed at Regular w"}, {"dir": "webflow", "name": "webflow", "desc": "Webflow's website is a visually rich, tool-forward platform that communicates \"design without code\" …", "tags": ["技术"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Webflow's website is a visually rich, tool-forward platform that communicates \"design without code\" through clean white surfaces, the signature Webflow Blue (`#146ef5`), and a rich secondary color palette (purple, pink, green, orange, yellow, red). The custom WF Visual Sans Variable font creates a confident, precise typographic system with weight 600 for display and 500 for body. **Key Characteristics:** - White canvas with near-black (`#080808`) text - Webflow Blue (`#146ef5`) as primary brand + interactive color - WF Visual Sans Variable — custom variable font"}, {"dir": "wired", "name": "Wired Inspired", "desc": "An inspired interpretation of Wired's design language — a flagship technology-magazine brand whose s…", "tags": ["媒体"], "has_preview": true, "has_dark": true, "design_md": "Overview Wired is the flagship technology-magazine brand under Condé Nast — and the web surface refuses to dress itself as a SaaS marketing site. The page is unmistakably an editorial product: a white canvas, a strict black wordmark in the brand's proprietary `WiredDisplay` (a tall, narrow, high-contrast serif used at 64 px), and stacked story cards that read as a printed magazine grid ported to the screen. There is no atmospheric gradient, no decorative chrome, no chromatic accent — the brand's only colour beyond the black-and-white duet is the small `{colors.link}` (`#057dbc`) used for inli"}, {"dir": "wise", "name": "wise", "desc": "Wise's website is a bold, confident fintech platform that communicates \"money without borders\" throu…", "tags": ["金融"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Wise's website is a bold, confident fintech platform that communicates \"money without borders\" through massive typography and a distinctive lime-green accent. The design operates on a warm off-white canvas with near-black text (`#0e0f0c`) and a signature Wise Green (`#9fe870`) — a fresh, lime-bright color that feels alive and optimistic, unlike the corporate blues of traditional banking. The typography uses Wise Sans — a proprietary font used at extreme weight 900 (black) for display headings with a remarkably tight line-height of 0.85 and OpenType `\"calt\"` (cont"}, {"dir": "x.ai", "name": "x.ai", "desc": "xAI's website is a masterclass in dark-first, monospace-driven brutalist minimalism -- a design syst…", "tags": ["AI"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere xAI's website is a masterclass in dark-first, monospace-driven brutalist minimalism -- a design system that feels like it was built by engineers who understand that restraint is the ultimate form of sophistication. The entire experience is anchored to an almost-black background (`#1f2228`) with pure white text (`#ffffff`), creating a high-contrast, terminal-inspired aesthetic that signals deep technical credibility. There are no gradients, no decorative illustrations, no color accents competing for attention. This is a site that communicates through absence. The"}, {"dir": "zapier", "name": "zapier", "desc": "Zapier's website radiates warm, approachable professionalism. It rejects the cold monochrome minimal…", "tags": ["效率"], "has_preview": true, "has_dark": true, "design_md": "1. Visual Theme & Atmosphere Zapier's website radiates warm, approachable professionalism. It rejects the cold monochrome minimalism of developer tools in favor of a cream-tinted canvas (`#fffefb`) that feels like unbleached paper -- the digital equivalent of a well-organized notebook. The near-black (`#201515`) text has a faint reddish-brown warmth, creating an atmosphere more human than mechanical. This is automation designed to feel effortless, not technical. The typographic system is a deliberate interplay of two distinct personalities. **Degular Display** -- a geometric, wide-set displa"}];


let currentTab = 'systems';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('search').value = '';
  if (tab === 'systems') renderSystems('');
}

function handleSearch(v) {
  if (currentTab === 'systems') renderSystems(v);
}

function renderSystems(filter) {
  const grid = document.getElementById('systems-grid');
  const noRes = document.getElementById('no-results');
  const filtered = filter
    ? systems.filter(s => s.name.toLowerCase().includes(filter.toLowerCase()) || s.desc.includes(filter) || s.tags.some(t => t.includes(filter)))
    : systems;
  document.getElementById('count').textContent = `共 ${filtered.length} 个设计系统`;
  noRes.style.display = filtered.length ? 'none' : 'block';
  grid.innerHTML = filtered.map(s => `
    <div class="card" onclick="openSystemModal('${s.dir}')">
      <div class="card-name">
        ${s.has_preview ? '<span class="preview-dot"></span>' : ''}
        ${s.name}
      </div>
      <div class="card-desc">${s.desc}</div>
      <div class="card-tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
  `).join('');
}

function openSystemModal(dir) {
  const s = systems.find(x => x.dir === dir);
  if (!s) return;
  document.getElementById('modal-title').textContent = s.name;
  const body = document.getElementById('modal-body');

  if (s.has_preview) {
    body.innerHTML = `
      <div class="preview-toggle">
        <button class="preview-btn active" onclick="switchPreview('${dir}', 'light', this)">Preview</button>
        ${s.has_dark ? `<button class="preview-btn" onclick="switchPreview('${dir}', 'dark', this)">Dark</button>` : ''}
      </div>
      <iframe class="preview-frame" id="preview-frame" src="design-systems/${dir}/preview.html"></iframe>
    `;
  } else {
    let md = s.design_md;
    // Extract text content (strip markdown-ish headers)
    md = md.replace(/^\d+\.\s+/gm, '\n');
    md = md.replace(/\*\*([^*]+)\*\*/g, '$1');
    body.innerHTML = `<div style="max-width:700px"><p>${md}</p></div>`;
  }

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function switchPreview(dir, mode, btn) {
  btn.parentElement.querySelectorAll('.preview-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const frame = document.getElementById('preview-frame');
  if (mode === 'dark') {
    frame.src = 'design-systems/' + dir + '/preview-dark.html';
  } else {
    frame.src = 'design-systems/' + dir + '/preview.html';
  }
}


function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  // Clear iframe src to stop playback
  const frame = document.getElementById('preview-frame');
  if (frame) frame.src = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

renderSystems('');
</script>
